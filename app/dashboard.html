<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Model Router</title>
<style>
  :root {
    --ground: #fbfbfd; --panel: #fff; --ink: #16181d; --muted: #5a6472;
    --rule: #e2e5eb; --accent: #1f5f8b; --bar: #cfe0ec;
    --warn: #8a6114; --ok: #2e6b4f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground: #101317; --panel: #171b21; --ink: #e6e9ee; --muted: #98a3b2;
      --rule: #29313a; --accent: #6fb3df; --bar: #24404f;
      --warn: #d9a745; --ok: #6fbf95;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 28px 20px 64px; background: var(--ground); color: var(--ink);
    font: 14px/1.55 "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  }
  .wrap { max-width: 940px; margin: 0 auto; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  h1 { font-size: 22px; margin: 0; letter-spacing: -0.01em; }
  .sub { color: var(--muted); font-size: 13px; }
  h2 {
    font-size: 11px; letter-spacing: 0.11em; text-transform: uppercase;
    color: var(--muted); margin: 32px 0 10px; font-weight: 600;
  }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(148px, 1fr)); gap: 12px; margin-top: 20px; }
  .tile { background: var(--panel); border: 1px solid var(--rule); border-radius: 6px; padding: 14px 16px; }
  .tile dt { font-size: 11px; letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); }
  .tile dd { margin: 4px 0 0; font-size: 23px; font-variant-numeric: tabular-nums; }
  .tile dd small { font-size: 12px; color: var(--muted); font-variant-numeric: normal; }
  .scroll { overflow-x: auto; background: var(--panel); border: 1px solid var(--rule); border-radius: 6px; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th {
    text-align: left; font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--muted); padding: 10px 14px; border-bottom: 1px solid var(--rule); white-space: nowrap;
  }
  td { padding: 9px 14px; border-bottom: 1px solid var(--rule); white-space: nowrap; }
  tr:last-child td { border-bottom: none; }
  .num { text-align: right; }
  .bar { position: relative; min-width: 130px; }
  .bar span {
    position: absolute; inset: 6px auto 6px 14px; background: var(--bar);
    border-radius: 2px; z-index: 0;
  }
  .bar b { position: relative; z-index: 1; font-weight: 500; }
  .pill {
    font-size: 10.5px; padding: 1px 7px; border-radius: 10px;
    border: 1px solid var(--warn); color: var(--warn);
  }
  .muted { color: var(--muted); }
  code { font-family: "IBM Plex Mono", Consolas, monospace; font-size: 12px; }
  .empty { padding: 26px 16px; color: var(--muted); }
  footer { margin-top: 34px; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Model Router</h1>
      <div class="sub">Every request the persistence consumer has stored.</div>
    </div>
    <div class="sub" id="updated">loading…</div>
  </header>

  <dl class="tiles" id="tiles"></dl>

  <h2>By model that answered</h2>
  <div class="scroll"><table id="models"></table></div>

  <h2>By task type</h2>
  <div class="scroll"><table id="tasks"></table></div>

  <h2>Recent</h2>
  <div class="scroll"><table id="recent"></table></div>

  <footer>
    Costs are modelled at published paid-tier rates, not amounts billed.
    Unpriced requests are excluded from cost totals rather than counted as
    zero. Refreshes every 5s.
  </footer>
</div>

<script>
const money = v => "$" + v.toFixed(6);
const ms = v => Math.round(v).toLocaleString() + " ms";
const esc = s => String(s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

function tiles(t) {
  const cells = [
    ["Requests", t.requests],
    ["Total cost", money(t.total_cost_usd) +
      `<br><small>${money(t.analyzer_cost_usd)} routing + ${money(t.answering_cost_usd)} answering</small>`],
    ["Avg latency", ms(t.avg_latency_ms)],
    ["Avg confidence", t.avg_confidence.toFixed(2)],
    ["Fallback rate", (t.fallback_rate * 100).toFixed(0) + "%" +
      `<br><small>${t.fallbacks} of ${t.requests}</small>`],
    ["Unpriced", t.unpriced + (t.unpriced ? ` <span class="pill">excluded</span>` : "")],
  ];
  document.getElementById("tiles").innerHTML = cells
    .map(([k, v]) => `<div class="tile"><dt>${k}</dt><dd>${v}</dd></div>`).join("");
}

function models(rows) {
  const el = document.getElementById("models");
  if (!rows.length) { el.outerHTML = '<div class="empty">No requests stored yet.</div>'; return; }
  const max = Math.max(...rows.map(r => r.requests));
  el.innerHTML =
    `<thead><tr><th>Model</th><th class="num">Requests</th><th class="num">Avg</th>
     <th class="num">p95</th><th class="num">Tokens</th><th class="num">Cost</th></tr></thead><tbody>` +
    rows.map(r => `<tr>
      <td><code>${esc(r.model)}</code></td>
      <td class="num bar"><span style="width:${(r.requests / max * 100).toFixed(1)}%"></span><b>${r.requests}</b></td>
      <td class="num">${ms(r.avg_latency_ms)}</td>
      <td class="num">${ms(r.p95_latency_ms)}</td>
      <td class="num">${r.tokens.toLocaleString()}</td>
      <td class="num">${r.unpriced === r.requests ? '<span class="muted">n/a</span>' : money(r.cost_usd)}</td>
    </tr>`).join("") + "</tbody>";
}

function tasks(rows) {
  const el = document.getElementById("tasks");
  if (!rows.length) { el.outerHTML = '<div class="empty">Nothing yet.</div>'; return; }
  const max = Math.max(...rows.map(r => r.requests));
  el.innerHTML = `<thead><tr><th>Task type</th><th class="num">Requests</th></tr></thead><tbody>` +
    rows.map(r => `<tr><td>${esc(r.task_type)}</td>
      <td class="num bar"><span style="width:${(r.requests / max * 100).toFixed(1)}%"></span><b>${r.requests}</b></td>
    </tr>`).join("") + "</tbody>";
}

function recent(rows) {
  const el = document.getElementById("recent");
  if (!rows.length) { el.outerHTML = '<div class="empty">Nothing yet.</div>'; return; }
  el.innerHTML =
    `<thead><tr><th>When</th><th>Request</th><th>Task</th><th>Answered by</th>
     <th class="num">Latency</th><th class="num">Cost</th></tr></thead><tbody>` +
    rows.map(r => `<tr>
      <td class="muted">${new Date(r.created_at).toLocaleTimeString()}</td>
      <td><code>${esc(r.request_id.slice(0, 8))}</code></td>
      <td>${esc(r.task_type)}</td>
      <td><code>${esc(r.model)}</code>${r.fallback_used ? ' <span class="pill">fallback</span>' : ""}</td>
      <td class="num">${ms(r.latency_ms)}</td>
      <td class="num">${money(r.total_cost_usd)}</td>
    </tr>`).join("") + "</tbody>";
}

async function refresh() {
  try {
    const res = await fetch("/stats");
    if (!res.ok) throw new Error("HTTP " + res.status);
    const d = await res.json();
    tiles(d.totals); models(d.by_model); tasks(d.by_task_type); recent(d.recent);
    document.getElementById("updated").textContent =
      "updated " + new Date().toLocaleTimeString();
  } catch (err) {
    document.getElementById("updated").textContent = "cannot reach /stats — " + err.message;
  }
}

refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
