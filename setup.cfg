# Lint configuration. Without this, editors fall back to pycodestyle's
# 79-character default, which this codebase has never followed -- the
# result was ~34 false warnings across 17 files that were not defects.
# 88 is Black's default and every existing line already fits inside it.
[flake8]
max-line-length = 88
exclude =
    venv,
    .git,
    __pycache__,
    .pytest_cache
